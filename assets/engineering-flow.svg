<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Deimer Caro engineering flow</title>
  <desc id="desc">A subtle animated path connecting frontend, APIs, data, AI, and delivery.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b1930"/>
      <stop offset="1" stop-color="#10152b"/>
    </linearGradient>
    <linearGradient id="line" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { fill: #dbeafe; font: 600 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .04em; }
      .node { fill: #0b1930; stroke: url(#line); stroke-width: 2; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-in-out infinite; }
      .p2 { animation-delay: .5s; } .p3 { animation-delay: 1s; } .p4 { animation-delay: 1.5s; } .p5 { animation-delay: 2s; }
      .signal { animation: travel 6s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: .72; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes travel { from { transform: translateX(0); } to { transform: translateX(1040px); } }
      @media (prefers-reduced-motion: reduce) { .pulse, .signal { animation: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="148" rx="22" fill="url(#panel)" stroke="#1e3a5f"/>
  <path d="M80 64 H1120" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <circle class="signal" cx="80" cy="64" r="6" fill="#f8fafc" filter="url(#glow)"/>
  <g class="pulse"><circle class="node" cx="80" cy="64" r="13"/><circle cx="80" cy="64" r="4" fill="#22d3ee"/></g>
  <g class="pulse p2"><circle class="node" cx="340" cy="64" r="13"/><circle cx="340" cy="64" r="4" fill="#38bdf8"/></g>
  <g class="pulse p3"><circle class="node" cx="600" cy="64" r="13"/><circle cx="600" cy="64" r="4" fill="#8b5cf6"/></g>
  <g class="pulse p4"><circle class="node" cx="860" cy="64" r="13"/><circle cx="860" cy="64" r="4" fill="#c084fc"/></g>
  <g class="pulse p5"><circle class="node" cx="1120" cy="64" r="13"/><circle cx="1120" cy="64" r="4" fill="#f59e0b"/></g>
  <text class="label" x="80" y="112" text-anchor="middle">FRONTEND</text>
  <text class="label" x="340" y="112" text-anchor="middle">APIs</text>
  <text class="label" x="600" y="112" text-anchor="middle">DATA</text>
  <text class="label" x="860" y="112" text-anchor="middle">AI / RAG</text>
  <text class="label" x="1120" y="112" text-anchor="middle">DELIVERY</text>
</svg>
